<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>더치페이 정산 요청</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      body {
        background-color: #f4f6f8;
        color: #333;
        display: flex;
        justify-content: center;
        padding: 20px 16px 40px;
      }
      .container {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 20px;
        padding: 24px 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      .header {
        text-align: center;
        margin-bottom: 24px;
      }
      .header h2 {
        font-size: 22px;
        color: #1a1d20;
        margin-bottom: 6px;
      }
      .header p {
        font-size: 14px;
        color: #6c757d;
      }
      .bank-card {
        background-color: #eef2ff;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
        text-align: center;
        border: 1px solid #dbe2fe;
      }
      .bank-name {
        font-size: 13px;
        color: #4f46e5;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .account-num {
        font-size: 18px;
        font-weight: bold;
        color: #1e1b4b;
        letter-spacing: 0.5px;
      }
      .member-list {
        margin-bottom: 24px;
      }
      .member-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        border: 2px solid #edf2f7;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .member-item.selected {
        border-color: #3b82f6;
        background-color: #f0f7ff;
      }
      .member-name {
        font-weight: 600;
        font-size: 16px;
      }
      .member-amount {
        font-weight: bold;
        font-size: 16px;
        color: #2563eb;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.1s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-toss {
        background-color: #0064ff;
        color: #ffffff;
      }
      .btn-kakao {
        background-color: #fee500;
        color: #191919;
      }
      .btn-copy {
        background-color: #f1f5f9;
        color: #475569;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.9);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 13px;
        display: none;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>정산 요청이 도착했습니다</h2>
        <p>본인을 선택한 뒤 송금 방법을 고르세요. 앱이 열리는 것만으로는 입금 완료로 처리되지 않습니다.</p>
      </div>

      <!-- 입금 계좌 정보 -->
      <div class="bank-card">
        <div class="bank-name" id="bankDisplay">입금 은행</div>
        <div class="account-num" id="accDisplay">계좌번호</div>
      </div>

      <!-- 참여자 및 금액 목록 -->
      <div class="member-list" id="memberList"></div>

      <!-- 송금 실행 버튼 영역 -->
      <div class="btn-group">
        <button class="btn btn-toss" onclick="payViaToss()">
          토스로 송금하기
        </button>
        <button class="btn btn-kakao" onclick="payViaKakao()">
          카카오페이로 송금하기 (계좌 복사)
        </button>
        <button class="btn btn-copy" onclick="copyAccountOnly()">
          계좌번호만 복사하기
        </button>
      </div>
    </div>

    <div class="toast" id="toast">계좌번호가 복사되었습니다!</div>

    <script>
'use strict';
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
// Fixed API prevents query-string API substitution and account spoofing.
const API_BASE = 'https://dcw-6vyo.onrender.com';
let accountNumber='', bankName='', selectedId=null, selectedAmount=0, members=[];
let loading=false, fresh=false;
const list=document.getElementById('memberList');
const buttons=[...document.querySelectorAll('.btn')];

// ===== 기기 판별 =====
const UA = navigator.userAgent;
const IS_ANDROID = /Android/i.test(UA);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA);

// ===== 앱 정보 =====
const TOSS_PACKAGE  = 'viva.republica.toss';
const KAKAO_PACKAGE = 'com.kakao.talk';
const TOSS_STORE  = IS_IOS ? 'https://apps.apple.com/kr/app/id839333328'
                           : 'https://play.google.com/store/apps/details?id=viva.republica.toss';
const KAKAO_STORE = IS_IOS ? 'https://apps.apple.com/kr/app/id362057947'
                           : 'https://play.google.com/store/apps/details?id=com.kakao.talk';

// 앱(main.py)에서 고를 수 있는 은행 → 토스용 은행 이름 / 금융기관 코드
const BANKS = {
  '토스뱅크':   { toss: '토스뱅크',   code: '092' },
  '카카오뱅크': { toss: '카카오뱅크', code: '090' },
  '국민은행':   { toss: '국민',       code: '004' },
  '신한은행':   { toss: '신한',       code: '088' },
  '우리은행':   { toss: '우리',       code: '020' },
  '하나은행':   { toss: '하나',       code: '081' },
  '농협은행':   { toss: '농협',       code: '011' },
};
function bankInfo(name){
  const key = String(name||'').trim();
  return BANKS[key] || { toss: key.replace(/은행$/,''), code: '' };
}
function onlyDigits(v){ return String(v||'').replace(/[^0-9]/g,''); }

// 카카오페이 '계좌송금 화면' 바로 열기(은행·계좌·금액 자동 입력)는
// 공식적으로 알림톡 버튼용으로만 안내된 링크라 기본은 꺼둠(false).
// true로 바꾸면 송금 화면 진입을 먼저 시도하고, 안 되면 카카오페이 홈 → 카카오톡 순서로 넘어감.
const KAKAO_DIRECT_TRANSFER = false;

function showToast(message){const e=document.getElementById('toast'); e.textContent=message; e.style.display='block';setTimeout(()=>e.style.display='none',3000);}
function render(){
 list.replaceChildren();
 for(const member of members){
  const button=document.createElement('button'); button.type='button';
  button.className='member-item'+(member.id===selectedId?' selected':''); button.style.width='100%';
  const name=document.createElement('span'); name.className='member-name'; name.textContent=member.name;
  const amount=document.createElement('span'); amount.className='member-amount';
  amount.textContent=Number(member.amount).toLocaleString()+'원 · '+(member.status==='paid'?'입금 완료':'입금 대기');
  button.append(name,amount);
  button.onclick=()=>{selectedId=member.id;selectedAmount=member.amount;render();};
  list.append(button);
 }
 const selected=members.find(x=>x.id===selectedId);
 buttons[0].disabled=buttons[1].disabled=!fresh || !selected || selected.status==='paid';
 buttons[2].disabled=!fresh || !accountNumber;
}
async function refresh(){
 if(loading||document.hidden)return; loading=true;
 const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),65000);
 try{
  if(!token)throw new Error('유효한 정산 링크가 필요합니다. 이전 data 형식 링크는 지원하지 않습니다.');
  const response=await fetch(API_BASE+'/api/public/settlements/'+encodeURIComponent(token),{signal:controller.signal,cache:'no-store',credentials:'omit'});
  const data=await response.json(); if(!response.ok)throw new Error(data.error||'조회 실패');
  if(!Array.isArray(data.participants)||!data.participants.length)throw new Error('참여자 정보가 없습니다.');
  members=data.participants; bankName=data.bank;accountNumber=data.account;fresh=true;
  document.getElementById('bankDisplay').textContent=bankName;
  document.getElementById('accDisplay').textContent=accountNumber;
  render();
 }catch(error){fresh=false;buttons.forEach(b=>b.disabled=true);list.replaceChildren();const msg=document.createElement('p');msg.textContent='조회 실패: '+error.message+' (자동 재시도 중)';list.append(msg);}
 finally{clearTimeout(timeout);loading=false;}
}

// ===== 복사 =====
// 앱으로 이동하기 직전에 쓰는 '즉시 복사'. 기다리지 않아서 터치 직후 바로 앱을 열 수 있음.
function copyNow(value){
 let ok=false;
 try{
  const ta=document.createElement('textarea');
  ta.value=value; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, value.length);
  ok=document.execCommand('copy');
  document.body.removeChild(ta);
 }catch(_){ ok=false; }
 // 최신 방식도 함께 시도 (결과를 기다리지 않음)
 if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(value).catch(()=>{}); ok=true; }
 return ok;
}
async function copy(value){
 try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(value);return true;}
 catch(_){window.prompt('복사할 내용을 길게 눌러 복사하세요.',value);return false;}
}
async function copyAccountOnly(){if(!fresh||!accountNumber)return; if(await copy(bankName+' '+accountNumber))showToast('계좌번호가 복사되었습니다.');}

// ===== 딥링크 열기 =====
// 카카오톡 대화방에서 링크를 누르면 '카카오톡 인앱 브라우저'로 열림
const IN_KAKAO = /KAKAOTALK/i.test(UA);

// location.href 대신 숨긴 <a>를 만들어 '클릭' → 인앱 브라우저에서 더 잘 열림
function openLink(url){
 const a=document.createElement('a');
 a.href=url; a.rel='noopener'; a.style.display='none';
 document.body.appendChild(a); a.click();
 setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); }, 1000);
}
// url을 열고, waitMs 안에 앱으로 넘어가지 않으면(페이지가 안 숨겨지면) onFail 실행
function tryOpen(url, onFail, waitMs){
 let left=false;
 const mark=()=>{ left=true; };
 const onVis=()=>{ if(document.hidden) left=true; };
 document.addEventListener('visibilitychange', onVis);
 window.addEventListener('pagehide', mark);
 window.addEventListener('blur', mark);
 setTimeout(()=>{
  document.removeEventListener('visibilitychange', onVis);
  window.removeEventListener('pagehide', mark);
  window.removeEventListener('blur', mark);
  if(!left && !document.hidden && onFail) onFail();
 }, waitMs||1500);
 openLink(url);
}
// 안드로이드 크롬/삼성인터넷용 intent 주소: scheme://path 를 특정 앱(package)으로 열기
function intentURL(scheme, pathAndQuery, packageName, fallbackURL){
 return 'intent://'+pathAndQuery+'#Intent;scheme='+scheme+';package='+packageName+
        (fallbackURL ? ';S.browser_fallback_url='+encodeURIComponent(fallbackURL) : '')+';end';
}
function selectedMember(){
 const member=members.find(x=>x.id===selectedId);
 if(!fresh||!member||member.status==='paid'){showToast('먼저 목록에서 본인 이름을 눌러 선택하세요.');return null;}
 return member;
}

// ===== 토스: 송금 화면을 은행·계좌·금액이 채워진 상태로 열기 =====
function payViaToss(){
 const member=selectedMember(); if(!member)return;
 copyNow(bankName+' '+accountNumber); // 자동 입력이 안 될 때 붙여넣기용
 // origin=linkgen : 토스 송금 링크가 쓰는 값. 없으면 송금 화면 대신 홈만 열릴 수 있음
 const q='bank='+encodeURIComponent(bankInfo(bankName).toss)+
         '&accountNo='+onlyDigits(accountNumber)+
         '&origin=linkgen'+
         '&amount='+onlyDigits(member.amount);
 if(IS_ANDROID && !IN_KAKAO){
  // 크롬/삼성인터넷: intent 방식 (토스 없으면 Play 스토어)
  openLink(intentURL('supertoss','send?'+q, TOSS_PACKAGE, TOSS_STORE));
 }else{
  // 아이폰 + 카카오톡 인앱 브라우저: scheme 직접 호출, 안 열리면 스토어
  tryOpen('supertoss://send?'+q, ()=>openLink(TOSS_STORE), 2000);
 }
 showToast('토스에서 받는 분과 금액을 확인한 뒤 송금하세요.');
}

// ===== 카카오: 계좌 복사 → 카카오페이 → (실패 시) 카카오톡 =====
function payViaKakao(){
 const member=selectedMember(); if(!member)return;
 const copied=copyNow(bankName+' '+accountNumber);
 showToast(copied ? '계좌번호를 복사했어요. 카카오페이 송금 화면에 붙여넣으세요.'
                  : '복사가 안 됐다면 [계좌번호만 복사하기]를 눌러주세요.');
 const info=bankInfo(bankName);
 const steps=[];
 if(KAKAO_DIRECT_TRANSFER && info.code){
  const q='bank_code='+info.code+'&bank_account_number='+onlyDigits(accountNumber)+'&amount='+onlyDigits(member.amount);
  steps.push('kakaotalk://kakaopay/money/to/bank?'+q);
 }
 // 1순위: 카카오톡 안의 카카오페이 홈 (scheme 직접 호출)
 steps.push('kakaotalk://kakaopay/home');
 // 2순위: 카카오톡 열기 (안드로이드 일반 브라우저는 intent, 없으면 스토어)
 steps.push(IS_ANDROID && !IN_KAKAO ? intentURL('kakaotalk','main', KAKAO_PACKAGE, KAKAO_STORE) : 'kakaotalk://main');

 // 첫 번째는 '터치 직후 바로' 열어야 브라우저가 막지 않음 (setTimeout으로 미루지 않음)
 const next=(i)=>{
  if(i>=steps.length){ openLink(KAKAO_STORE); return; }
  tryOpen(steps[i], ()=>next(i+1), 1500);
 };
 next(0);
}

buttons.forEach(b=>b.disabled=true);
refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
    </script>
  </body>
</html>
